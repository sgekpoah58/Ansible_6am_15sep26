---
- hosts: webservers
  become: yes
  tasks:
    - name: Install Java on Debian-based systems
      apt:
        name: {{myjavapackondebian}}
        state: present
        when: ansible_os_family == "Debian"

    - name: Install Java on RedHat-based systems
      yum:
        name: {{myjavapackonredhat}}
        state: present
        when: ansible_os_family == "RedHat"